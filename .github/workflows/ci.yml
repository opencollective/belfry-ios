name: CI

on:
  push:
    branches: [main]
    # a release with a new minor version: the full suite (every screenshot, every UI test)
    tags: ['v*.*.0']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: The full suite (every screenshot, every UI test, light and dark)
        type: boolean
        default: false
      shots:
        description: Screens to capture (a regex on scripts/screenshots.sh's names, e.g. "invite.*|charter"); empty = from the changed files
        default: ''
      uitests:
        description: UI tests to run ("testAddMenu testTodoAssign", or "all"); empty = from the changed files
        default: ''

# Concurrency is per job (below), not for the whole run: a newer push stops the older run's tests,
# but never a TestFlight upload that has started (run 44402826705's simulator jobs were cancelled by
# the next push; an upload in progress would have been too).

env:
  XCODE: /Applications/Xcode_16.4.app

# What runs (Xavier, 2026-11-18; the app job used to take an hour on every push):
# - plan: reads the changed files (scripts/ci-plan.py) and says what they can have touched.
# - core: BelfryCore's tests, when the core, its tests or the vectors changed.
# - sim: the app built for the simulator, then only the screenshots and UI tests of the screens the
#   change touched (one job; up to three for many screens). The full suite (three screenshot jobs
#   and the UI tests in light and in dark, side by side) only for a release with a new minor
#   version: a tag vX.Y.0, a new major or minor MARKETING_VERSION, or the `full` input.
# - testflight: on main, after the core tests only. It does not wait for the simulator jobs: its
#   own archive is the compile check.
jobs:
  plan:
    name: Plan (what the change touched)
    concurrency:
      group: ci-${{ github.ref }}-plan
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.plan.outputs.core }}
      app: ${{ steps.plan.outputs.app }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_FULL: ${{ inputs.full }}
          INPUT_SHOTS: ${{ inputs.shots }}
          INPUT_UITESTS: ${{ inputs.uitests }}
        run: python3 scripts/ci-plan.py

  core:
    name: Core tests (vectors)
    needs: plan
    if: needs.plan.outputs.core == 'true'
    concurrency:
      group: ci-${{ github.ref }}-core
      cancel-in-progress: true
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s "$XCODE" && xcodebuild -version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Speed in a release build (offline first budgets, CLAUDE.md)
        run: swift test -c release --filter PerformanceTests 2>&1 | grep -E "perf:|passed|failed|error" | tail -20
      - name: Test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-log
          path: swift-test.log

  sim:
    name: Simulator (${{ matrix.part.name }})
    needs: plan
    if: needs.plan.outputs.parts != '[]'
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    concurrency:
      group: ci-${{ github.ref }}-sim-${{ matrix.part.name }}
      cancel-in-progress: true
    # Xcode 26 / the iOS 26 SDK: the screenshots show the glass the owner's iPhone draws
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE" && xcodebuild -version
      - name: Boot the simulator (it goes on booting while the app compiles)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for want in ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16", "iPhone 15 Pro"]:
              for rt, devs in sorted(d.items(), reverse=True):
                  for x in devs:
                      if x["name"] == want and "iOS" in rt:
                          print(x["udid"]); sys.exit(0)
          ')
          [ -n "$UDID" ] || exit 0
          xcrun simctl boot "$UDID" || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-app26-${{ runner.os }}-${{ hashFiles('Package.swift', 'project.yml') }}
      - name: Build for the simulator (app + UI tests)
        run: |
          set -o pipefail
          xcodebuild -project Belfry.xcodeproj -scheme Belfry -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*BelfryApp|BUILD (SUCCEEDED|FAILED)|TEST BUILD (SUCCEEDED|FAILED)" || true
          if grep -q "BUILD FAILED" xcodebuild.log; then exit 1; fi
          test -d build/Build/Products/Debug-iphonesimulator/Belfry.app
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.part.name }}
          path: xcodebuild.log
      - name: Screenshots and UI tests (${{ matrix.part.shard }})
        env:
          SHOTS: ${{ matrix.part.shots }}
          SHARD: ${{ matrix.part.shard }}
          UITESTS: ${{ matrix.part.uitests }}
          UIMODES: ${{ matrix.part.uimodes }}
        run: |
          XCTESTRUN=$(ls build/Build/Products/*.xctestrun 2>/dev/null | head -1) \
            scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/Belfry.app screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.part.name }}
          path: screenshots

  screenshots:
    name: Screenshots (one artifact)
    needs: [plan, sim]
    if: always() && needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: screenshots-*
          delete-merged: true

  testflight:
    name: TestFlight (only with signing secrets)
    # after the core tests (when the change needed them), not after the simulator jobs
    needs: [plan, core]
    if: always() && github.ref == 'refs/heads/main' && needs.plan.outputs.app == 'true' && (needs.core.result == 'success' || needs.core.result == 'skipped')
    # one upload at a time, never cancelled: a newer push waits for it
    concurrency:
      group: testflight
      cancel-in-progress: false
    # App Store Connect only takes builds made with the iOS 26 SDK (Xcode 26) or later
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Secrets present?
        id: check
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight skipped: add APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (see CLAUDE.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - name: Archive and upload
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XCODE" && xcodebuild -version
          brew install xcodegen && xcodegen generate
          mkdir -p private_keys
          echo "$ASC_KEY_P8" > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          KEY="$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # automatic signing makes a development certificate per runner; the team may hold ten
          ASC_KEY_FILE="$KEY" python3 scripts/asc-certs.py list > "$RUNNER_TEMP/certs-before"
          BUILD=$(( $(date +%s) / 60 ))
          xcodebuild -project Belfry.xcodeproj -scheme Belfry -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Belfry.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" archive
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Belfry.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Revoke this run's development certificate
        if: always() && steps.check.outputs.ok == 'true'
        run: |
          KEY="$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [ -f "$KEY" ] && [ -f "$RUNNER_TEMP/certs-before" ]; then
            ASC_KEY_FILE="$KEY" python3 scripts/asc-certs.py revoke-new "$RUNNER_TEMP/certs-before" || true
          fi
          rm -rf private_keys
